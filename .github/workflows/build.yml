name: Build Aseprite Windows x64

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Aseprite for Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout build template
        uses: actions/checkout@v4

      - name: Install Python requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Aseprite and Skia
        shell: pwsh
        run: |
          python download.py

      - name: Setup Ninja
        uses: ashutoshvarma/setup-ninja@v1.1

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v3
        with:
          arch: x64

      - name: Configure Aseprite
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null

          cmake `
            "${{ github.workspace }}/src/aseprite" `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=MinSizeRel `
            -DLAF_BACKEND=skia `
            -DSKIA_DIR="${{ github.workspace }}/src/skia" `
            -DSKIA_LIBRARY_DIR="${{ github.workspace }}/src/skia/out/Release-x64" `
            -DSKIA_LIBRARY="${{ github.workspace }}/src/skia/out/Release-x64/skia.lib"

      - name: Build Aseprite
        shell: pwsh
        run: |
          cmake --build build --config MinSizeRel --target aseprite

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "${{ github.workspace }}/build/bin/aseprite.exe"

          if (!(Test-Path $exe)) {
            Write-Host "Aseprite executable was not created."
            exit 1
          }

          Write-Host "Aseprite executable found:"
          Get-Item $exe

      - name: Check OpenSSL DLL
        shell: pwsh
        run: |
          $bin = "${{ github.workspace }}/build/bin"

          Write-Host "Searching for required DLLs..."

          $crypto = Get-ChildItem `
            -Path "${{ github.workspace }}/build" `
            -Filter "libcrypto-3-x64.dll" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          $ssl = Get-ChildItem `
            -Path "${{ github.workspace }}/build" `
            -Filter "libssl-3-x64.dll" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($crypto) {
            Copy-Item $crypto.FullName "$bin\libcrypto-3-x64.dll" -Force
            Write-Host "libcrypto-3-x64.dll copied."
          }

          if ($ssl) {
            Copy-Item $ssl.FullName "$bin\libssl-3-x64.dll" -Force
            Write-Host "libssl-3-x64.dll copied."
          }

          Write-Host "`nFinal build/bin contents:"
          Get-ChildItem $bin

      - name: Get Aseprite version
        id: version
        shell: pwsh
        run: |
          $version = Get-Content "${{ github.workspace }}/src/aseprite/version.txt"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "${{ github.workspace }}/build/bin/*" `
            -DestinationPath "${{ github.workspace }}/Aseprite-Windows-x64-${{ steps.version.outputs.version }}.zip" `
            -Force

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-x64
          path: Aseprite-Windows-x64-${{ steps.version.outputs.version }}.zip
