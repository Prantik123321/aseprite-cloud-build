name: Build Aseprite Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout Aseprite
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        shell: pwsh
        run: |
          choco install ninja -y
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y

      - name: Download Skia
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\deps\skia | Out-Null

          Invoke-WebRequest `
            -Uri "https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip" `
            -OutFile C:\skia.zip

          Expand-Archive `
            -Path C:\skia.zip `
            -DestinationPath C:\deps\skia `
            -Force

      - name: Configure
        shell: cmd
        run: |
          mkdir build
          cd build

          cmake -G Ninja ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DLAF_BACKEND=skia ^
            -DSKIA_DIR=C:\deps\skia ^
            -DSKIA_LIBRARY_DIR=C:\deps\skia\out\Release-x64 ^
            -DSKIA_LIBRARY=C:\deps\skia\out\Release-x64\skia.lib ^
            ..

      - name: Build
        shell: cmd
        run: |
          cd build
          ninja aseprite

      - name: Upload Aseprite EXE
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows
          path: build/bin/aseprite.exe
