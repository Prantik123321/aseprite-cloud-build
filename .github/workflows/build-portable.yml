name: Build Aseprite Portable (Full Working)

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches: [ main ]

env:
  BUILD_TYPE: Release

jobs:
  build-windows:
    runs-on: windows-2022
    
    steps:
    - name: Checkout Aseprite
      uses: actions/checkout@v4
      with:
        repository: aseprite/aseprite
        path: aseprite
        submodules: recursive
        ref: v1.3.3  # Stable version use করছি

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install CMake and Ninja
      run: |
        choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y
        choco install ninja -y

    - name: Download Skia (Prebuilt)
      shell: powershell
      run: |
        $skiaUrl = "https://github.com/aseprite/skia/releases/download/m102-861e4743af/Skia-Windows-Release-x64.zip"
        Invoke-WebRequest -Uri $skiaUrl -OutFile "skia.zip"
        Expand-Archive -Path "skia.zip" -DestinationPath "skia" -Force
        Write-Host "Skia downloaded and extracted successfully"

    - name: Configure CMake
      shell: cmd
      working-directory: aseprite
      run: |
        mkdir build
        cd build
        cmake -G Ninja ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DLAF_BACKEND=skia ^
          -DSKIA_DIR=../skia ^
          -DSKIA_LIBRARY_DIR=../skia/out/Release-x64 ^
          -DSKIA_LIBRARY=../skia/out/Release-x64/skia.lib ^
          -DENABLE_UI=ON ^
          -DENABLE_TESTS=OFF ^
          -DENABLE_BENCHMARKS=OFF ^
          -DENABLE_TRIAL_MODE=OFF ^
          -DENABLE_CRASH_HANDLER=OFF ^
          -DENABLE_UPDATER=OFF ^
          -DENABLE_STEAM=OFF ^
          -DENABLE_DRM=OFF ^
          ..

    - name: Build Aseprite
      shell: cmd
      working-directory: aseprite/build
      run: |
        ninja aseprite

    - name: Create Portable Package (All DLLs Included)
      shell: powershell
      run: |
        $portableDir = "aseprite-portable"
        New-Item -ItemType Directory -Force -Path $portableDir
        
        # Main executable copy
        Copy-Item "aseprite\build\bin\aseprite.exe" "$portableDir\"
        
        # Data folder copy (essential for UI)
        Copy-Item "aseprite\build\bin\data" "$portableDir\" -Recurse -Force
        
        # All required DLLs from build
        Get-ChildItem "aseprite\build\bin\*.dll" | Copy-Item -Destination $portableDir -Force
        
        # Additional system DLLs (সব dependencies সহ)
        $dllList = @(
          "msvcp140.dll",
          "vcruntime140.dll",
          "vcruntime140_1.dll",
          "msvcp140_1.dll",
          "msvcp140_2.dll"
        )
        
        # Visual C++ Redistributable DLLs
        $vcRedistPaths = @(
          "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Redist\MSVC\*\x64\Microsoft.VC143.CRT\*"
        )
        
        foreach ($path in $vcRedistPaths) {
          Get-ChildItem $path -ErrorAction SilentlyContinue | Copy-Item -Destination $portableDir -Force
        }
        
        # Create ZIP
        Compress-Archive -Path "$portableDir\*" -DestinationPath "Aseprite-Portable-Windows-x64.zip" -Force
        
        Write-Host "Portable package created successfully!"

    - name: Upload Portable ZIP
      uses: actions/upload-artifact@v4
      with:
        name: Aseprite-Portable-Windows-x64
        path: Aseprite-Portable-Windows-x64.zip
        retention-days: 90

    - name: Create GitHub Release
      if: github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        files: Aseprite-Portable-Windows-x64.zip
        tag_name: v1.3.3-portable
        name: Aseprite v1.3.3 Portable (Full Working)
        body: |
          ## ✅ Aseprite Portable Build
          - **Version:** 1.3.3
          - **Platform:** Windows x64
          - **Type:** Portable (No installation needed)
          - **All DLLs included** - Just extract and run
          
          ## 📦 How to Use:
          1. Download the ZIP file
          2. Extract anywhere
          3. Run `aseprite.exe`
          4. No installation required!
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Verify Build (Testing)
      shell: powershell
      run: |
        Write-Host "=== Build Verification ==="
        Write-Host "Checking executable..."
        if (Test-Path "aseprite\build\bin\aseprite.exe") {
          $size = (Get-Item "aseprite\build\bin\aseprite.exe").Length / 1MB
          Write-Host "✓ aseprite.exe found ($([math]::Round($size, 2)) MB)"
        } else {
          Write-Host "✗ aseprite.exe NOT found!"
          exit 1
        }
        
        Write-Host "Checking data folder..."
        if (Test-Path "aseprite\build\bin\data") {
          Write-Host "✓ data folder found"
        } else {
          Write-Host "✗ data folder NOT found!"
          exit 1
        }
        
        Write-Host "=== All checks passed! ==="
